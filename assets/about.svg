311" fill="#c9ced4" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16.5" xml:space="preserve">applied AI. After hours: Sentinel (cost-weighted fraud decisioning) and Paygate (a</text><text x="40" y="336" fill="#c9ced4" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16.5" xml:space="preserve">payment-auth state machine).</text><g fill="#e6e1d6"><rect x="40" y="387" width="20" height="4"/><rect x="48" y="391" width="4" height="4"/><rect x="48" y="395" width="4" height="4"/><rect x="48" y="399" width="4" height="4"/><rect x="48" y="403" width="4" height="4"/><rect x="48" y="407" width="4" height="4"/><rect x="48" y="411" width="4" height="4"/><rect x="64" y="387" width="4" height="4"/><rect x="80" y="387" width="4" height="4"/><rect x="64" y="391" width="4" height="4"/><rect x="80" y="391" width="4" height="4"/><rect x="64" y="395" width="4" height="4"/><rect x="80" y="395" width="4" height="4"/><rect x="64" y="399" width="20" height="4"/><rect x="64" y="403" width="4" height="4"/><rect x="80" y="403" width="4" height="4"/><rect x="64" y="407" width="4" height="4"/><rect x="80" y="407" width="4" height="4"/><rect x="64" y="411" width="4" height="4"/><rect x="80" y="411" width="4" height="4"/><rect x="88" y="387" width="20" height="4"/><rect x="88" y="391" width="4" height="4"/><rect x="88" y="395" width="4" height="4"/><rect x="88" y="399" width="16" height="4"/><rect x="88" y="403" width="4" height="4"/><rect x="88" y="407" width="4" height="4"/><rect x="88" y="411" width="20" height="4"/><rect x="140" y="387" width="16" height="4"/><rect x="136" y="391" width="4" height="4"/><rect x="136" y="395" width="4" height="4"/><rect x="136" y="399" width="4" height="4"/><rect x="136" y="403" width="4" height="4"/><rect x="136" y="407" width="4" height="4"/><rect x="140" y="411" width="16" height="4"/><rect x="164" y="387" width="12" height="4"/><rect x="160" y="391" width="4" height="4"/><rect x="176" y="391" width="4" height="4"/><rect x="160" y="395" width="4" height="4"/><rect x="176" y="395" width="4" height="4"/><rect x="160" y="399" width="4" height="4"/><rect x="176" y="399" width="4" height="4"/><rect x="160" y="403" width="4" height="4"/><rect x="176" y="403" width="4" height="4"/><rect x="160" y="407" width="4" height="4"/><rect x="176" y="407" width="4" height="4"/><rect x="164" y="411" width="12" height="4"/><rect x="184" y="387" width="16" height="4"/><rect x="184" y="391" width="4" height="4"/><rect x="200" y="391" width="4" height="4"/><rect x="184" y="395" width="4" height="4"/><rect x="200" y="395" width="4" height="4"/><rect x="184" y="399" width="4" height="4"/><rect x="200" y="399" width="4" height="4"/><rect x="184" y="403" width="4" height="4"/><rect x="200" y="403" width="4" height="4"/><rect x="184" y="407" width="4" height="4"/><rect x="200" y="407" width="4" height="4"/><rect x="184" y="411" width="16" height="4"/><rect x="208" y="387" width="20" height="4"/><rect x="208" y="391" width="4" height="4"/><rect x="208" y="395" width="4" height="4"/><rect x="208" y="399" width="16" height="4"/><rect x="208" y="403" width="4" height="4"/><rect x="208" y="407" width="4" height="4"/><rect x="208" y="411" width="20" height="4"/></g><text x="40" y="445" fill="#c9ced4" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16.5" xml:space="preserve">Models predict. Policy decides. The ML stays behind a mask of guardrails, state machines</text><text x="40" y="470" fill="#c9ced4" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16.5" xml:space="preserve">and hash-chained audit trails, and a model's confidence has to come with a reason: Grad-</text><text x="40" y="495" fill="#c9ced4" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16.5" xml:space="preserve">CAM, reason codes, evidence.</text><g fill="#e6e1d6"><rect x="40" y="546" width="4" height="4"/><rect x="56" y="546" width="4" height="4"/><rect x="40" y="550" width="8" height="4"/><rect x="56" y="550" width="4" height="4"/><rect x="40" y="554" width="4" height="4"/><rect x="48" y="554" width="4" height="4"/><rect x="56" y="554" width="4" height="4"/><rect x="40" y="558" width="4" height="4"/><rect x="52" y="558" width="8" height="4"/><rect x="40" y="562" width="4" height="4"/><rect x="56" y="562" width="4" height="4"/><rect x="40" y="566" width="4" height="4"/><rect x="56" y="566" width="4" height="4"/><rect x="40" y="570" width="4" height="4"/><rect x="56" y="570" width="4" height="4"/><rect x="64" y="546" width="20" height="4"/><rect x="64" y="550" width="4" height="4"/><rect x="64" y="554" width="4" height="4"/><rect x="64" y="558" width="16" height="4"/><rect x="64" y="562" width="4" height="4"/><rect x="64" y="566" width="4" height="4"/><rect x="64" y="570" width="20" height="4"/><rect x="88" y="546" width="4" height="4"/><rect x="104" y="546" width="4" height="4"/><rect x="88" y="550" width="4" height="4"/><rect x="104" y="550" width="4" height="4"/><rect x="92" y="554" width="4" height="4"/><rect x="100" y="554" width="4" height="4"/><rect x="96" y="558" width="4" height="4"/><rect x="92" y="562" width="4" height="4"/><rect x="100" y="562" width="4" height="4"/><rect x="88" y="566" width="4" height="4"/><rect x="104" y="566" width="4" height="4"/><rect x="88" y="570" width="4" height="4"/><rect x="104" y="570" width="4" height="4"/><rect x="112" y="546" width="20" height="4"/><rect x="120" y="550" width="4" height="4"/><rect x="120" y="554" width="4" height="4"/><rect x="120" y="558" width="4" height="4"/><rect x="120" y="562" width="4" height="4"/><rect x="120" y="566" width="4" height="4"/><rect x="120" y="570" width="4" height="4"/></g><text x="40" y="604" fill="#c9ced4" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16.5" xml:space="preserve">ML engineering, MLOps and LLM applications that hold up in real workflows. Open to roles</text><text x="40" y="629" fill="#c9ced4" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16.5" xml:space="preserve">in ML Engineering and Agentic AI.</text><rect x="0.5" y="0.5" width="999" height="673" fill="none" stroke="#23272c"/></svg>